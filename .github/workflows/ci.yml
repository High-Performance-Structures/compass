name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  help:
    name: Help content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run help:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Compass Core ownership ratchet: eslint-suppressions.json may only
      # shrink, and no inline directive may disable a compass-core rule.
      - run: git fetch --no-tags --depth=1 origin main
      - run: bun run core:check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The whole project, tests and fixtures included: a type error in a test
      # usually means the fixture no longer matches the code it claims to cover.
      - run: bun run typecheck

  dead-code:
    name: Dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run knip

  ui-standards:
    name: UI Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run ui:check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The production build peaks near Node's default ~4 GB heap; give it room.
      - run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # Shared server code must stay in one copy (docs/architecture/server-bundle.md).
      - run: bun run bundle:check
